<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love Catcher 💖</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(#ffb6c1, #ffe4e1);
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 10px;
      color: #c2185b;
    }

    canvas {
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin-top: 10px;
    }

    #msg {
      font-size: 22px;
      color: #d81b60;
      margin-top: 10px;
      display: none;
    }

    .controls {
      margin: 15px;
      font-size: 18px;
      color: #880e4f;
    }
  </style>
</head>

<body>

<h1>💘 Love Catcher 💘</h1>

<div class="controls">
  ⬅️ ➡️ Move | Collect all hearts 💗
</div>

<canvas id="game" width="360" height="500"></canvas>

<div id="msg">I Love You 💖 Happy Valentine's Day!</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

// Player
let player = {
  x: W / 2 - 20,
  y: H - 60,
  w: 40,
  h: 40,
  speed: 6
};

// Hearts
let hearts = [];
const totalHearts = 7;

// Score
let score = 0;
let gameWon = false;

// Controls
let left = false;
let right = false;


// Create hearts
function spawnHearts() {
  hearts = [];
  for (let i = 0; i < totalHearts; i++) {
    hearts.push({
      x: Math.random() * (W - 30),
      y: Math.random() * (H - 200) + 50,
      size: 22,
      alive: true
    });
  }
}

spawnHearts();


// Keyboard
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") left = true;
  if (e.key === "ArrowRight") right = true;
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") left = false;
  if (e.key === "ArrowRight") right = false;
});


// Touch (mobile)
canvas.addEventListener("touchmove", e => {
  let touch = e.touches[0];
  let rect = canvas.getBoundingClientRect();
  player.x = touch.clientX - rect.left - 20;
});


// Draw heart
function drawHeart(x, y, s) {
  ctx.fillStyle = "#e91e63";

  ctx.beginPath();
  ctx.arc(x + s*0.3, y + s*0.3, s*0.3, 0, Math.PI*2);
  ctx.arc(x + s*0.7, y + s*0.3, s*0.3, 0, Math.PI*2);

  ctx.moveTo(x, y + s*0.4);
  ctx.lineTo(x + s/2, y + s);
  ctx.lineTo(x + s, y + s*0.4);

  ctx.closePath();
  ctx.fill();
}


// Collision
function hit(a, b) {
  return (
    a.x < b.x + b.size &&
    a.x + a.w > b.x &&
    a.y < b.y + b.size &&
    a.y + a.h > b.y
  );
}


// Game Loop
function update() {

  if (!gameWon) {

    if (left) player.x -= player.speed;
    if (right) player.x += player.speed;

    player.x = Math.max(0, Math.min(W - player.w, player.x));

    hearts.forEach(h => {
      if (h.alive && hit(player, h)) {
        h.alive = false;
        score++;
      }
    });

    if (score === totalHearts) {
      gameWon = true;
      document.getElementById("msg").style.display = "block";
    }
  }
}


// Draw
function draw() {

  ctx.clearRect(0,0,W,H);

  // Player
  ctx.fillStyle = "#2196f3";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Hearts
  hearts.forEach(h => {
    if (h.alive) drawHeart(h.x, h.y, h.size);
  });

  // Score
  ctx.fillStyle = "#880e4f";
  ctx.font = "18px Arial";
  ctx.fillText(`Hearts: ${score}/${totalHearts}`, 10, 25);

  if (gameWon) {
    ctx.fillStyle = "#d81b60";
    ctx.font = "26px Arial";
    ctx.fillText("YOU WIN 💖", 120, 240);
  }
}


// Main loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
