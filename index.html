<!DOCTYPE html>
<html>
<head>
  <title>Love Game 💖</title>
</head>

<body style="text-align:center; font-family:Arial; background:pink;">

<h1>💘 Love Catcher 💘</h1>

<canvas id="c" width="300" height="400"
style="background:white;border:2px solid black;">
</canvas>

<p id="msg"></p>

<script>

const c = document.getElementById("c");
const ctx = c.getContext("2d");

let x = 130;
let score = 0;

let hearts = [];

for(let i=0;i<5;i++){
  hearts.push({
    x: Math.random()*260,
    y: Math.random()*300,
    alive:true
  });
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") x-=20;
  if(e.key==="ArrowRight") x+=20;
});

function loop(){

  ctx.clearRect(0,0,300,400);

  // player
  ctx.fillStyle="blue";
  ctx.fillRect(x,350,40,40);

  // hearts
  ctx.fillStyle="red";
  hearts.forEach(h=>{
    if(h.alive){
      ctx.beginPath();
      ctx.arc(h.x,h.y,10,0,6.28);
      ctx.fill();

      if(x<h.x+10 && x+40>h.x && 350<h.y+10){
        h.alive=false;
        score++;
      }
    }
  });

  ctx.fillText("Score: "+score,10,20);

  if(score===5){
    document.getElementById("msg").innerText =
      "I Love You 💖";
  }

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
